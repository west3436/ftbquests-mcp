name: Build (1.20.1)

# Path-filtered to the bridge mod; the companion plugin is built and tested on the 1.21.1 branch.
on:
  push:
    branches: ["1.20.1"]
    paths: ["ftbquests-bridge/**", ".github/workflows/build-1.20.1.yml"]
  pull_request:
    branches: ["1.20.1"]
    paths: ["ftbquests-bridge/**", ".github/workflows/build-1.20.1.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge:
    name: ftbquests-bridge 1.20.1 (Forge + Fabric)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ftbquests-bridge
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # Gradle/Loom run on 21; the mod is compiled with --release 17 for Minecraft 1.20.1.
          java-version: "21"

      # Also validates every gradle-wrapper.jar in the repo against Gradle's published checksums.
      - uses: gradle/actions/setup-gradle@v6

      # Invoked through bash in case gradlew is committed without the executable bit.
      - name: Build and test
        run: bash ./gradlew build --no-daemon --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: ftbquests-bridge-1.20.1
          path: |
            ftbquests-bridge/forge/build/libs/*.jar
            ftbquests-bridge/fabric/build/libs/*.jar
          if-no-files-found: warn
