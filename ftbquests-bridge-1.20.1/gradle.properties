# --- JDK ---
# Gradle must run on JDK 17 for MC 1.20.1 / Forge 47: point JAVA_HOME at a JDK 17, or pass
# -Dorg.gradle.java.home=<path> on the command line. Not pinned here because the path is
# machine-specific and CI provides a JDK 17 toolchain via setup-java.
# The locale flags keep javac diagnostics out of the platform default charset (mojibake on a
# GBK console); they do not affect the compiled output.
org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

# --- Mod metadata (expanded into mods.toml by processResources) ---
mod_id=ftbqbridge
mod_name=FTB Quests Bridge
mod_version=1.2.0
mod_group=com.ftbqbridge
mod_authors=west3436, mmyddd
mod_description=Loopback HTTP+JSON bridge for authoring FTB Quests content.
mod_license=MIT
mod_url=https://github.com/west3436/ftbquests-mcp

# --- Target platform ---
minecraft_version=1.20.1
minecraft_forge_version=1.20.1-47.4.1
# 2001.x is the 1.20.1 line of FTB Quests. 2001.4.11 is the version this port targets;
# it needs Chapter.getPath() and ChapterGroup.getChildren().
ftb_quests_version=2001.4.11
ftb_library_version=2001.2.4
ftb_teams_version=2001.3.0
architectury_version=9.2.14
