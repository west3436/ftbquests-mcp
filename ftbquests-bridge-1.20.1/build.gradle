plugins {
    id "java"
    id "net.neoforged.moddev.legacyforge" version "2.0.142"
}

group = mod_group
version = mod_version

base {
    archivesName = "ftbquests-bridge-forge"
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
    withSourcesJar()
}

repositories {
    mavenCentral()
    // FTB publishes ftb-quests / ftb-library / ftb-teams here only.
    maven {
        url "https://maven.ftb.dev/releases"
        content { includeGroup "dev.ftb.mods" }
    }
    // Architectury is a hard runtime dependency of FTB Quests.
    maven {
        url "https://maven.shedaniel.me/"
        content {
            includeGroupAndSubgroups "me.shedaniel"
            includeGroup "dev.architectury"
        }
    }
    // JEI is a transitive API dependency of FTB Quests.
    maven { url "https://maven.blamejared.com/" }
}

legacyForge {
    version = minecraft_forge_version

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    runs {
        server {
            server()
            gameDirectory = file("run/server")
            programArguments.addAll "--nogui"
        }
        client {
            client()
            gameDirectory = file("run/client")
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }
}

dependencies {
    // Compile-only: the bridge is always installed next to FTB Quests at runtime, and
    // bundling FTB classes would break its own mod loading.
    modCompileOnly "dev.ftb.mods:ftb-quests-forge:" + ftb_quests_version
    modCompileOnly "dev.ftb.mods:ftb-library-forge:" + ftb_library_version
    modCompileOnly "dev.ftb.mods:ftb-teams-forge:" + ftb_teams_version
    modCompileOnly "dev.architectury:architectury-forge:" + architectury_version

    // Runtime-only so `runServer` boots a real 1.20.1 + FTB Quests environment for end-to-end checks.
    // Not bundled: the produced jar still depends on FTB Quests being installed separately.
    modRuntimeOnly "dev.ftb.mods:ftb-quests-forge:" + ftb_quests_version
    modRuntimeOnly "dev.ftb.mods:ftb-library-forge:" + ftb_library_version
    modRuntimeOnly "dev.ftb.mods:ftb-teams-forge:" + ftb_teams_version
    modRuntimeOnly "dev.architectury:architectury-forge:" + architectury_version

    testImplementation platform("org.junit:junit-bom:5.10.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
}

// Forge expands ${file.jarVersion} in mods.toml from the manifest, so the manifest needs the version.
jar {
    manifest {
        attributes(
                "Implementation-Title": mod_name,
                "Implementation-Version": mod_version,
                "Implementation-Vendor": mod_authors,
        )
    }
}

// MDG only wires the Minecraft classpath into `main`, but the unit tests import classes that
// reference Minecraft types (RegistryReader.NameResolver, QuestTree's callers), so give the test
// source set the same classpath. Nothing here boots Forge: the tests never touch Bootstrap.
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

processResources {
    // Forge substitutes ${file.jarVersion} from the jar manifest at load time, so that token
    // must survive packaging. Gradle's expand() would choke on it, so replace only OUR tokens.
    def tokens = [
            mod_authors       : mod_authors,
            mod_description   : mod_description,
            mod_license       : mod_license,
            mod_url           : mod_url,
            ftb_quests_version: ftb_quests_version,
    ]
    inputs.properties(tokens)
    filesMatching("META-INF/mods.toml") {
        filter { String line ->
            String out = line
            tokens.each { key, value ->
                out = out.replace('${' + key + '}', value.toString())
            }
            out
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 17
}

test {
    useJUnitPlatform()
}