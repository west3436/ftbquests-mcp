modLoader = "javafml"
loaderVersion = "[47,)"
license = "${mod_license}"
issueTrackerURL = "${mod_url}/issues"

[[mods]]
modId = "ftbqbridge"
version = "${file.jarVersion}"
displayName = "FTB Quests Bridge"
# Original mod by west3436; 1.20.1 Forge port by mmyddd.
authors = '''${mod_authors}'''
credits = "1.20.1 / Forge port: mmyddd"
description = '''${mod_description}'''

[[dependencies.ftbqbridge]]
    modId = "forge"
    mandatory = true
    versionRange = "[47,)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.ftbqbridge]]
    modId = "minecraft"
    mandatory = true
    versionRange = "[1.20.1,1.21)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.ftbqbridge]]
    # Declared explicitly: the bridge calls Architectury's BaseS2CMessage.sendToAll directly.
    modId = "architectury"
    mandatory = true
    versionRange = "[9.0.8,)"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.ftbqbridge]]
    modId = "ftbquests"
    mandatory = true
    versionRange = "[${ftb_quests_version},)"
    ordering = "AFTER"
    side = "BOTH"