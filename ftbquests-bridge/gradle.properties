# Gradle itself must run on JDK 21 (Architectury Loom 1.17 requires it), but the mod is compiled for
# Java 17, which is what Minecraft 1.20.1 runs on. Set JAVA_HOME to a JDK 21, or pass
# -Dorg.gradle.java.home=<path>; not pinned here because the path is machine-specific.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

minecraft_version=1.20.1
enabled_platforms=fabric,forge

archives_base_name=ftbquests-bridge
mod_version=1.3.0
maven_group=com.ftbqbridge

architectury_api_version=9.2.14
fabric_loader_version=0.16.14
fabric_api_version=0.92.2+1.20.1
forge_version=1.20.1-47.4.1

# FTB mods (1.20.1 / 2001.x line). 2001.4.11 is the version this port targets; it needs
# Chapter.getPath() and ChapterGroup.getChildren(). It is also the oldest version the bridge
# declares as a required dependency (mods.toml / fabric.mod.json).
ftb_quests_version=2001.4.11
ftb_library_version=2001.2.4
ftb_teams_version=2001.3.0
ftb_quests_min_version=2001.4.11
