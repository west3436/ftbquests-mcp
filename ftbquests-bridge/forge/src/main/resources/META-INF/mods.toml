modLoader = "javafml"
loaderVersion = "[47,)"
license = "MIT"
issueTrackerURL = "https://github.com/west3436/ftbquests-mcp/issues"

[[mods]]
modId = "ftbqbridge"
version = "${version}"
displayName = "FTB Quests Bridge"
# Original mod by west3436; 1.20.1 port by mmyddd.
authors = "west3436, mmyddd"
credits = "1.20.1 port: mmyddd"
description = '''Loopback HTTP+JSON bridge for authoring FTB Quests content, with quest-book screenshots on the client.'''

[[dependencies.ftbqbridge]]
    modId = "forge"
    mandatory = true
    versionRange = "[47,)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.ftbqbridge]]
    modId = "minecraft"
    mandatory = true
    versionRange = "[1.20.1,1.21)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.ftbqbridge]]
    # Declared explicitly: the bridge calls Architectury's Platform and BaseS2CMessage directly.
    modId = "architectury"
    mandatory = true
    versionRange = "[9.0.8,)"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.ftbqbridge]]
    modId = "ftbquests"
    mandatory = true
    versionRange = "[${ftbQuestsMinVersion},)"
    ordering = "AFTER"
    side = "BOTH"
