plugins {
    id "com.gradleup.shadow" version "9.5.0"
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common
    shadowBundle
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
}

dependencies {
    forge "net.minecraftforge:forge:${rootProject.forge_version}"
    modApi "dev.architectury:architectury-forge:${rootProject.architectury_api_version}"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowBundle project(path: ":common", configuration: "transformProductionForge")

    // Loader-specific FTB mods at dev runtime so ServerQuestFile actually loads in runServer.
    // They are not bundled: the released jar declares FTB Quests as a required dependency instead.
    modImplementation "dev.ftb.mods:ftb-quests-forge:${rootProject.ftb_quests_version}"
    modImplementation "dev.ftb.mods:ftb-library-forge:${rootProject.ftb_library_version}"
    modImplementation "dev.ftb.mods:ftb-teams-forge:${rootProject.ftb_teams_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "ftbQuestsMinVersion", rootProject.ftb_quests_min_version
    filesMatching("META-INF/mods.toml") {
        expand "version": project.version, "ftbQuestsMinVersion": rootProject.ftb_quests_min_version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "dev-shadow"
}

remapJar {
    inputFile.set shadowJar.archiveFile
    archiveClassifier = null
    dependsOn shadowJar
}

jar {
    archiveClassifier = "dev"
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}
